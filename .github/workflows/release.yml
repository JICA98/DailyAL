name: Build and Release

on:
  push:
    tags:
      - '20*'

  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - linux-android
          - windows

permissions:
  contents: write

jobs:

  # ==========================================
  # LINUX + ANDROID
  # ==========================================

  build-linux-android:
    runs-on: ubuntu-latest

    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux-android' }}

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------
      # SETUP
      # ----------------------------------------

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libfuse2 \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libayatana-appindicator3-dev

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Upgrade Android Gradle Wrapper
        run: |
          sed -i 's/gradle-8.13-all.zip/gradle-8.14.3-all.zip/' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Get Dependencies
        run: flutter pub get

      # ----------------------------------------
      # ANDROID DEBUG
      # ----------------------------------------

      - name: Build Android Debug APK
        run: flutter build apk --debug

      # ----------------------------------------
      # ANDROID RELEASE
      # ----------------------------------------

      - name: Build Android Release APK
        run: flutter build apk --release

      # ----------------------------------------
      # LINUX DEBUG
      # ----------------------------------------

      - name: Build Linux Debug
        run: flutter build linux --debug

      - name: Package Linux Debug
        run: |
          cd build/linux/x64/debug
          tar -czf DailyAL-Linux-Debug.tar.gz bundle

      # ----------------------------------------
      # LINUX RELEASE
      # ----------------------------------------

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux AppImage
        run: |
          chmod +x linux/packaging/package.sh
          ./linux/packaging/package.sh

      # ----------------------------------------
      # PREPARE ARTIFACTS
      # ----------------------------------------

      - name: Prepare Artifacts
        run: |
          mkdir -p release-artifacts

          cp build/app/outputs/flutter-apk/app-debug.apk \
            release-artifacts/DailyAL-Android-Debug.apk

          cp build/app/outputs/flutter-apk/app-release.apk \
            release-artifacts/DailyAL-Android-Release.apk

          cp build/linux/x64/debug/DailyAL-Linux-Debug.tar.gz \
            release-artifacts/

          cp linux/packaging/DailyAL-x86_64.AppImage \
            release-artifacts/

          cd release-artifacts

          sha1sum DailyAL-Android-Debug.apk > DailyAL-Android-Debug.apk.sha1
          sha1sum DailyAL-Android-Release.apk > DailyAL-Android-Release.apk.sha1
          sha1sum DailyAL-Linux-Debug.tar.gz > DailyAL-Linux-Debug.tar.gz.sha1
          sha1sum DailyAL-x86_64.AppImage > DailyAL-x86_64.AppImage.sha1

      - name: Upload Linux and Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-linux-android
          path: release-artifacts/*

  # ==========================================
  # WINDOWS
  # ==========================================

  build-windows:
    runs-on: windows-latest

    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows' }}

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------
      # SETUP
      # ----------------------------------------

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      # ----------------------------------------
      # WINDOWS DEBUG
      # ----------------------------------------

      - name: Build Windows Debug
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build/windows -ErrorAction SilentlyContinue

          $env:CXXFLAGS = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

          flutter build windows --debug

      - name: Package Windows Debug
        run: |
          Compress-Archive `
            -Path build/windows/x64/runner/Debug/* `
            -DestinationPath DailyAL-Windows-Debug.zip

      # ----------------------------------------
      # WINDOWS RELEASE
      # ----------------------------------------

      - name: Build Windows Release
        shell: pwsh
        run: |
          $env:CXXFLAGS = "/D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS"

          flutter build windows --release

      - name: Create MSIX
        run: dart run msix:create --install-certificate false

      - name: Package Windows Release
        run: |
          Move-Item `
            -Path build/windows/x64/runner/Release/*.msix `
            -Destination DailyAL-Windows-x64.msix

          Compress-Archive `
            -Path build/windows/x64/runner/Release/* `
            -DestinationPath DailyAL-Windows-x64.zip

      # ----------------------------------------
      # CHECKSUMS
      # ----------------------------------------

      - name: Generate SHA1 Checksums
        shell: pwsh
        run: |
          Get-FileHash DailyAL-Windows-Debug.zip -Algorithm SHA1 |
            Select-Object -ExpandProperty Hash |
            Out-File -Encoding ascii DailyAL-Windows-Debug.zip.sha1

          Get-FileHash DailyAL-Windows-x64.zip -Algorithm SHA1 |
            Select-Object -ExpandProperty Hash |
            Out-File -Encoding ascii DailyAL-Windows-x64.zip.sha1

          Get-FileHash DailyAL-Windows-x64.msix -Algorithm SHA1 |
            Select-Object -ExpandProperty Hash |
            Out-File -Encoding ascii DailyAL-Windows-x64.msix.sha1

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-windows
          path: |
            DailyAL-Windows-Debug.zip
            DailyAL-Windows-Debug.zip.sha1
            DailyAL-Windows-x64.msix
            DailyAL-Windows-x64.msix.sha1
            DailyAL-Windows-x64.zip
            DailyAL-Windows-x64.zip.sha1

  # ==========================================
  # GITHUB RELEASE
  # ==========================================

  release:
    needs:
      - build-linux-android
      - build-windows

    runs-on: ubuntu-latest

    if: ${{ always() && startsWith(github.ref, 'refs/tags/20') && (needs.build-linux-android.result == 'success' || needs.build-windows.result == 'success') }}

    steps:

      - name: Download Linux and Android Artifacts
        if: ${{ needs.build-linux-android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-linux-android
          path: release-artifacts

      - name: Download Windows Artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-windows
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/DailyAL-Android-Debug.apk
            release-artifacts/DailyAL-Android-Debug.apk.sha1
            release-artifacts/DailyAL-Android-Release.apk
            release-artifacts/DailyAL-Android-Release.apk.sha1
            release-artifacts/DailyAL-Linux-Debug.tar.gz
            release-artifacts/DailyAL-Linux-Debug.tar.gz.sha1
            release-artifacts/DailyAL-x86_64.AppImage
            release-artifacts/DailyAL-x86_64.AppImage.sha1
            release-artifacts/DailyAL-Windows-Debug.zip
            release-artifacts/DailyAL-Windows-Debug.zip.sha1
            release-artifacts/DailyAL-Windows-x64.msix
            release-artifacts/DailyAL-Windows-x64.msix.sha1
            release-artifacts/DailyAL-Windows-x64.zip
            release-artifacts/DailyAL-Windows-x64.zip.sha1
