name: Build and Release

on:
  push:
    tags:
      - '20*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libfuse2

    - name: Enable Linux Desktop
      run: flutter config --enable-linux-desktop

    - name: Get Dependencies
      run: flutter pub get
    
    # Android Build
    - name: Build Android APK
      run: flutter build apk --release

    # Linux Build
    - name: Build Linux Release
      run: flutter build linux --release

    - name: Package Linux AppImage
      run: |
        chmod +x linux/packaging/package.sh
        ./linux/packaging/package.sh

    # SHA1 & Artifacts
    - name: Generate SHA1 Checksums and Prepare Artifacts
      run: |
        mkdir -p release-artifacts
        
        # Copy Android APK
        cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/
        cd release-artifacts
        sha1sum app-release.apk > app-release.apk.sha1
        cd ..
        
        # Copy Linux AppImage (generated in linux/packaging/)
        cp linux/packaging/DailyAL-x86_64.AppImage release-artifacts/
        cd release-artifacts
        sha1sum DailyAL-x86_64.AppImage > DailyAL-x86_64.AppImage.sha1
        cd ..

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-artifacts
        path: release-artifacts/*

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/20')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release-artifacts/app-release.apk
          release-artifacts/app-release.apk.sha1
          release-artifacts/DailyAL-x86_64.AppImage
          release-artifacts/DailyAL-x86_64.AppImage.sha1
