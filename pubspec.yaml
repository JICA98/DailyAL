name: dailyanimelist
description: Unofficial MAL Client

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html

version: 2026.2.5+107

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  window_manager: ^0.5.1
  tray_manager: ^0.5.2
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.0
  flutter_web_auth_2: ^5.0.0
  shimmer: ^3.0.0
  intl: ^0.20.0
  fluttertoast: ^9.0.0
  connectivity_plus: ^6.0.5
  carousel_slider: ^5.0.0
  html: ^0.15.0
  html_unescape: ^2.0.0
  scrollable_positioned_list: ^0.3.8
  fl_chart: ^0.68.0
  flutter_html: ^3.0.0-beta.2
  scroll_to_index: ^3.0.1
  share_plus: ^10.0.2
  built_collection: ^5.1.0
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.0
  flutter_custom_tabs: ^2.1.0
  flex_color_picker: ^3.5.1
  translator_plus: ^1.0.1
  image_picker: ^1.1.2
  uuid: ^4.0.0
  dotted_border: ^2.1.0
  retry: ^3.1.2
  auto_size_text: ^3.0.0
  visibility_detector: ^0.4.0+2
  photo_view: ^0.15.0
  dio: ^5.6.0
  infinite_scroll_pagination: ^4.0.0
  line_icons: ^2.0.3
  dynamic_color: ^1.7.0
  device_info_plus: ^10.1.2
  flutter_dotenv: ^5.1.0
  dal_api:
    path: ./dal-api
  dal_commons:
    path: ./dal-api/dal_commons

  flutter_localizations:
    sdk: flutter
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.0
  flutter_phoenix: ^1.1.1
  collection: ^1.18.0
  file_picker: ^8.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  package_info_plus: ^9.0.0
  webviewtube: ^2.1.1
  graphview: ^1.2.0
  flutter_displaymode: ^0.7.0
  add_2_calendar:
    git:
      url: https://github.com/JICA98/add_2_calendar.git

dev_dependencies:
  flutter_test:
    sdk: flutter
  json_annotation: ^4.0.1
  json_serializable: ^6.7.1
  build_runner: ^2.1.7
  intl_utils: ^2.8.4
  msix: ^3.16.13

flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/cherry.jpg
    - assets/images/summer.jpg
    - assets/images/winter.png
    - assets/images/fall.jpg

    - assets/images/gemini.png
    - assets/images/star.png
    - assets/images/user_dal.png
    - assets/images/myanimelist-logo.jpg
    - assets/images/mal-icon.png
    - assets/images/anime-icon.png
    - assets/images/general-icon.png
    - assets/images/anime-collage.jpg
    - assets/images/dal-black-bg.png
    - assets/images/opm.jpg
    - assets/images/user-unknown.jpg
    - assets/images/youtube.png
    - assets/images/error_image.png
    - assets/n8TN5qDG22PAuP50Il
    # - images/a_dot_ham.jpeg
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Italic.ttf
          style: italic
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700

    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700

    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-Regular.ttf
        - asset: assets/fonts/Quicksand-Medium.ttf
          weight: 500
        - asset: assets/fonts/Quicksand-Bold.ttf
          weight: 700

    - family: DubStatus
      fonts:
        - asset: assets/fonts/MyDubListIcons.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_intl:
  enabled: true

msix_config:
  display_name: DailyAL
  publisher_display_name: JICA98
  identity_name: io.github.jica98.dailyal
  publisher: CN=JICA98
  msix_version: 1.0.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
